name: Native

on:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: windows-clangcl
          - os: ubuntu-24.04
            preset: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ""
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-archives
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Linux build interfaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config nasm autoconf automake libtool libltdl-dev autoconf-archive \
            libx11-dev libxft-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libegl1-mesa-dev libdrm-dev libgbm-dev libibus-1.0-dev
      - name: Create binary cache directory
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: vcpkg-cache
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/BootstrapVcpkg.cmake') }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/BootstrapVcpkg.cmake') }}-
            ${{ matrix.os }}-vcpkg-
            ${{ runner.os }}-vcpkg-
      - name: Configure with pinned dependencies
        run: cmake --preset ${{ matrix.preset }}
      - name: Build native game and fixtures
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test native contracts
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
