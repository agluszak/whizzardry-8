name: Native Windows

on:
  pull_request:
    branches:
      - main
      - devin/1791589184-native-only-cleanup

jobs:
  clang-cl:
    runs-on: windows-2025
    env:
      VCPKG_ROOT: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure with pinned dependencies
        run: cmake --preset windows-clangcl
      - name: Build native game and fixtures
        run: cmake --build --preset windows-clangcl --parallel 4
      - name: Test native file, save, audio and input behavior
        run: ctest --preset windows-clangcl --output-on-failure
