name: One-off clone scan

on:
  push:
    branches:
      - analysis/clone-scan-20261011
  pull_request:
    paths:
      - .github/workflows/clone-scan-oneoff.yml

permissions:
  contents: read

jobs:
  clones:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install jscpd and PMD
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/clone-tools" --no-audit --no-fund jscpd@5.4.0
          curl -fLSs --retry 3 "https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.27.0/pmd-dist-7.27.0-bin.zip" -o "$RUNNER_TEMP/pmd.zip"
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/clone-tools/node_modules/.bin/jscpd" --version
          "$RUNNER_TEMP/pmd-bin-7.27.0/bin/pmd" --version
      - name: jscpd exact and renamed
        shell: bash
        run: |
          set -euo pipefail
          jscpd="$RUNNER_TEMP/clone-tools/node_modules/.bin/jscpd"
          mkdir -p scan-reports/jscpd-exact scan-reports/jscpd-identifiers scan-reports/jscpd-fuzzy
          "$jscpd" src include --mode weak --min-tokens 90 --min-lines 12 --cross-formats "cpp,c" --reporters json,html --output scan-reports/jscpd-exact --summary --summary-top 20 --no-tips
          "$jscpd" src include --mode weak --min-tokens 90 --min-lines 12 --cross-formats "cpp,c" --ignore-identifiers --max-gap-lines 5 --reporters json,html --output scan-reports/jscpd-identifiers --summary --summary-top 20 --no-tips
          "$jscpd" src include --mode weak --min-tokens 90 --min-lines 12 --cross-formats "cpp,c" --ignore-identifiers --ignore-literals --max-gap-lines 5 --reporters json,html --output scan-reports/jscpd-fuzzy --summary --summary-top 20 --no-tips
      - name: PMD CPD exact and renamed
        shell: bash
        run: |
          set -euo pipefail
          pmd="$RUNNER_TEMP/pmd-bin-7.27.0/bin/pmd"
          mkdir -p scan-reports/pmd
          "$pmd" cpd --language cpp --minimum-tokens 90 --dir src --dir include --format xml --report-file scan-reports/pmd/exact.xml --no-fail-on-violation --no-fail-on-error
          "$pmd" cpd --language cpp --minimum-tokens 90 --dir src --dir include --ignore-identifiers --format xml --report-file scan-reports/pmd/identifiers.xml --no-fail-on-violation --no-fail-on-error
          "$pmd" cpd --language cpp --minimum-tokens 90 --dir src --dir include --ignore-identifiers --ignore-literals --format xml --report-file scan-reports/pmd/fuzzy.xml --no-fail-on-violation --no-fail-on-error
      - name: Summarize filtered candidates
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def interesting(a,b):
              names=(a,b)
              return all(x.endswith('.cpp') for x in names) and not any(
                  x in a or x in b for x in ('English.cpp', 'core.cpp', 'QuoteManager.cpp'))
          for mode in ('jscpd-exact','jscpd-identifiers','jscpd-fuzzy'):
              p=Path('scan-reports')/mode/'jscpd-report.json'
              if not p.exists():
                  print(mode, 'MISSING')
                  continue
              d=json.loads(p.read_text())
              allpairs=d.get('duplicates',[])
              filtered=[x for x in allpairs if interesting(x['firstFile']['name'],x['secondFile']['name'])
                  and x['firstFile']['start']>60 and x['secondFile']['start']>60
                  and (x['firstFile']['name']!=x['secondFile']['name']
                       or x['firstFile']['end']<x['secondFile']['start']
                       or x['secondFile']['end']<x['firstFile']['start'])]
              print('===',mode,'total',len(allpairs),'filtered',len(filtered))
              print('total stats:',d.get('statistics',{}).get('total',{}))
              for x in sorted(filtered,key=lambda c:(c['lines'],c['tokens']),reverse=True)[:30]:
                  a,b=x['firstFile'],x['secondFile']
                  print(f"{x['lines']:>3}L {x['tokens']:>5}T {x['kind']} {a['name']}:{a['start']}-{a['end']} <> {b['name']}:{b['start']}-{b['end']}")
          for mode in ('exact','identifiers','fuzzy'):
              p=Path('scan-reports/pmd')/(mode+'.xml')
              if not p.exists():
                  print(mode,'MISSING')
                  continue
              groups=ET.parse(p).getroot().findall('.//{*}duplication')
              print('=== PMD',mode,'total',len(groups))
              filtered=[]
              for x in groups:
                  fs=x.findall('{*}file')
                  names=[f.get('path','').split('/src/')[-1] for f in fs]
                  if len(fs)>8 or len(fs)<2 or not interesting(names[0],names[1]):
                      continue
                  if int(fs[0].get('line','0'))<=60 or int(fs[1].get('line','0'))<=60:continue
                  filtered.append((x,names))
              for x,names in sorted(filtered,key=lambda r:(int(r[0].get('lines',0)),int(r[0].get('tokens',0))),reverse=True)[:30]:
                  fs=x.findall('{*}file')
                  print(x.get('lines'),'L',x.get('tokens'),'T',len(fs),'copies',' <> '.join(f"{names[i]}:{z.get('line')}-{z.get('endline')}" for i,z in enumerate(fs[:3])))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whizzardry-clone-scan
          path: scan-reports/
          retention-days: 7
