name: Toolchain image

on:
  push:
    paths: [Dockerfile, .dockerignore, .github/workflows/toolchain.yml]
  workflow_dispatch:

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REVISION }}
      - name: Publish toolchain
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-toolchain"
          tag="$image:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag "$tag" .
          docker push "$tag"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          [[ "$ref" == "$image"@sha256:* ]]
          printf '%s\n' "$ref" | tee toolchain-image.txt
          printf 'Published toolchain: `%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
          docker manifest inspect "$ref" >/dev/null
          echo 'Anonymous image access verified.' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolchain-image
          path: toolchain-image.txt
          if-no-files-found: error
