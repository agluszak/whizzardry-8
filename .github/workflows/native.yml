name: Native

on:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-archives
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build interfaces
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build ccache pkg-config nasm autoconf automake libtool libltdl-dev autoconf-archive \
            libx11-dev libxft-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libegl1-mesa-dev libdrm-dev libgbm-dev libibus-1.0-dev
      - name: Create cache directories
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$CCACHE_DIR"
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: vcpkg-cache
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: linux-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/BootstrapVcpkg.cmake') }}
          restore-keys: |
            linux-vcpkg-
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: ccache-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.run_id }}
          restore-keys: |
            linux-ccache-
      - name: Configure with pinned dependencies
        run: cmake --preset linux -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build native game and fixtures
        run: cmake --build --preset linux --parallel "$(nproc)"
      - name: Test native contracts
        run: ctest --preset linux --output-on-failure
      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats || true
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.run_id }}
