name: Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  # Let a running main build finish so it can seed caches for PRs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-26.04
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
      shaders: ${{ steps.scope.outputs.shaders }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select required checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' != pull_request && '${{ github.event_name }}' != push ]] ||
             [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'checks=true' >> "$GITHUB_OUTPUT"
            echo 'shaders=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo 'checks=true' >> "$GITHUB_OUTPUT"
            echo 'shaders=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          names = [os.fsdecode(p) for p in Path(os.environ['RUNNER_TEMP'], 'changed').read_bytes().split(b'\0') if p]
          checks = any(not (p.endswith('.md') or p in ('LICENSE', '.gitignore') or p.startswith('docs/')) for p in names)
          shaders = any(p.startswith(('tools/shadercross/', 'src/surrender/devices/sdl_gpu/compiled/'))
                        or p.endswith('.glsl') or p.startswith('conan')
                        or p in ('CMakeLists.txt', 'CMakePresets.json', '.github/workflows/native.yml', 'tools/install-llvm.sh')
                        for p in names)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'checks={str(checks).lower()}\nshaders={str(shaders).lower()}\n')
          PYTHON

  native:
    needs: scope
    if: needs.scope.outputs.checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["linux", "linux-integer-audit"]') || fromJSON('["linux", "linux-asan"]') }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    env:
      # Both sanitizer presets use the same unsanitized Conan dependencies.
      CONAN_BUILD_TYPE: ${{ matrix.preset == 'linux' && 'Debug' || 'RelWithDebInfo' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 2G
      # Clang PCH can be cached only with these documented ccache settings.
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Clang 23, libstdc++ 16, CMake 4.4.4 and Conan 2
        run: |
          tools/install-llvm.sh 23 clang
          sudo apt-get install -y g++-16 ninja-build ccache python3-venv mesa-vulkan-drivers
          python3 -m venv "$RUNNER_TEMP/conan-venv"
          "$RUNNER_TEMP/conan-venv/bin/pip" install 'conan==2.33.0' 'cmake==4.4.4'
          echo "$RUNNER_TEMP/conan-venv/bin" >> "$GITHUB_PATH"
      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.conan2/p
          key: conan-cxx26-gcc16-clang23-${{ env.CONAN_BUILD_TYPE }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/*', 'conan/recipes/**') }}
          restore-keys: |
            conan-cxx26-gcc16-clang23-${{ env.CONAN_BUILD_TYPE }}-
      - name: Select software Vulkan driver
        run: echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - name: Create cache directories
        run: mkdir -p "$CCACHE_DIR"
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: ccache-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-cxx26-gcc16-${{ matrix.preset }}-clang23-${{ github.run_id }}
          restore-keys: |
            ccache-cxx26-gcc16-${{ matrix.preset }}-clang23-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Resolve Conan dependencies
        run: |
          build_type="$CONAN_BUILD_TYPE"
          conan export conan/recipes/libalsa
          CC=clang-23 CXX=clang++-23 conan install . \
            -pr:h conan/profiles/linux-clang23 -pr:b conan/profiles/linux-gcc16 \
            -s:h build_type="$build_type" -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            --build=missing \
            -of "build/${{ matrix.preset }}/conan"
      - name: Clean Conan build intermediates
        if: github.event_name == 'push' && steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache clean '*'
      # Only main's native jobs publish package binaries.
      - name: Save Conan packages
        if: github.event_name == 'push' && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.conan2/p
          key: conan-cxx26-gcc16-clang23-${{ env.CONAN_BUILD_TYPE }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/*', 'conan/recipes/**') }}
      - name: Configure
        run: |
          build_type="$CONAN_BUILD_TYPE"
          source "build/${{ matrix.preset }}/conan/conanbuild.sh"
          cmake --preset "${{ matrix.preset }}" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/${{ matrix.preset }}/conan/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE="$build_type" \
            -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_C_FLAGS_DEBUG="-O0 -g1" \
            -DCMAKE_CXX_FLAGS_DEBUG="-O0 -g1 -Xclang -fno-pch-timestamp" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g1 -DNDEBUG -Xclang -fno-pch-timestamp" \
            -DWIZ8_SURRENDER_UNITY_BUILD=ON -DWIZ8_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build native game and fixtures
        run: |
          source "build/${{ matrix.preset }}/conan/conanbuild.sh"
          cmake --build --preset ${{ matrix.preset }} --parallel "$(nproc)"
      # Publish the compiler cache as soon as main builds successfully;
      # frequent main pushes may cancel a run before its runtime tests finish.
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        # PRs restore the latest main cache; avoid filling storage with PR snapshots.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-cxx26-gcc16-${{ matrix.preset }}-clang23-${{ github.run_id }}
      # The canonical GOG installer is stored in the decomp project's private
      # wiz8-ci-inputs release. Never put decrypted game files in Actions cache.
      - name: Check access to licensed game assets
        id: game-assets
        env:
          INPUTS_TOKEN: ${{ secrets.WIZ8_INPUTS_TOKEN }}
          CACHE_KEY: ${{ secrets.WIZ8_CACHE_KEY }}
        run: |
          if [[ -n "$INPUTS_TOKEN" && -n "$CACHE_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Licensed runtime scenarios need WIZ8_INPUTS_TOKEN and WIZ8_CACHE_KEY repository secrets'
          fi

      - name: Restore encrypted game assets
        id: game-cache
        if: steps.game-assets.outputs.enabled == 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/wiz8-native-game-cache
          key: wiz8-native-game-v1-48e31728ef2615f4e1ee3e34c901feec8ea428a474fc9c7386cc11018311a68d

      - name: Prepare encrypted game assets on cache miss
        if: steps.game-assets.outputs.enabled == 'true' && steps.game-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.WIZ8_INPUTS_TOKEN }}
          WIZ8_CACHE_KEY: ${{ secrets.WIZ8_CACHE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends innoextract
          command -v gh
          download="$RUNNER_TEMP/wiz8-native-game-download"
          extracted="$RUNNER_TEMP/wiz8-native-game-extracted"
          encrypted="$RUNNER_TEMP/wiz8-native-game-cache/game.tar.enc"
          installer="$download/setup_wizardry_8_2001_12_23_.22306.exe"
          trap 'rm -rf "$download" "$extracted"' EXIT
          mkdir -p "$download" "$extracted" "$(dirname "$encrypted")"

          gh release download gog-22306 \
            --repo agluszak/wiz8-ci-inputs \
            --pattern setup_wizardry_8_2001_12_23_.22306.exe \
            --dir "$download"
          echo "48e31728ef2615f4e1ee3e34c901feec8ea428a474fc9c7386cc11018311a68d  $installer" | sha256sum -c -
          innoextract --output-dir "$extracted" "$installer"
          game_exe="$(find "$extracted" -type f -iname 'Wiz8.exe' -print -quit)"
          test -n "$game_exe"
          game_root="$(dirname "$game_exe")"
          test -d "$game_root/Data"
          test -d "$game_root/Levels"

          tar -C "$game_root" -cf - . | openssl enc \
            -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -out "$encrypted" -pass env:WIZ8_CACHE_KEY
          test -s "$encrypted"

      - name: Save encrypted game assets
        if: steps.game-assets.outputs.enabled == 'true' && steps.game-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/wiz8-native-game-cache
          key: ${{ steps.game-cache.outputs.cache-primary-key }}

      - name: Make licensed game assets available to CTest
        if: steps.game-assets.outputs.enabled == 'true'
        env:
          WIZ8_CACHE_KEY: ${{ secrets.WIZ8_CACHE_KEY }}
        run: |
          set -euo pipefail
          game_root="$RUNNER_TEMP/wiz8-native-game"
          encrypted="$RUNNER_TEMP/wiz8-native-game-cache/game.tar.enc"
          test -s "$encrypted"
          mkdir -p "$game_root"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted" -pass env:WIZ8_CACHE_KEY | tar -C "$game_root" -xf -
          test -d "$game_root/Data"
          test -d "$game_root/Levels"
          source "build/${{ matrix.preset }}/conan/conanrun.sh"
          prepared_root="$RUNNER_TEMP/wiz8-native-prepared"
          "build/${{ matrix.preset }}/wiz8_prepare_assets" "$prepared_root" "$game_root"
          echo "WIZ8_ASSET_ROOT=$prepared_root" >> "$GITHUB_ENV"

      - name: Test native contracts and licensed runtime scenarios
        run: |
          source "build/${{ matrix.preset }}/conan/conanrun.sh"
          if [[ '${{ matrix.preset }}' != linux ]]; then
            # SDL unloads the software Vulkan ICD before LSan scans globals.
            # Keep Mesa and its dependencies mapped so process-lifetime driver
            # allocations retain their real roots. Project leak checks stay on.
            export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
            export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          fi
          ctest --preset ${{ matrix.preset }} --output-on-failure --parallel "$(nproc)"

      - name: Remove decrypted game assets
        if: always() && steps.game-assets.outputs.enabled == 'true'
        run: rm -rf "$RUNNER_TEMP/wiz8-native-game"
      - name: Show compiler cache stats
        if: always()
        run: |
          echo '### ccache (${{ matrix.preset }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  clang-tidy:
    needs: scope
    if: needs.scope.outputs.checks == 'true'
    env:
      CLANG_TIDY_CACHE_DIR: ${{ github.workspace }}/build/tidy-cache
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Clang 23, libstdc++ 16, CMake 4.4.4 and Conan 2
        run: |
          tools/install-llvm.sh 23 clang clang-tidy
          sudo apt-get install -y g++-16 ninja-build python3-venv
          python3 -m venv "$RUNNER_TEMP/conan-venv"
          "$RUNNER_TEMP/conan-venv/bin/pip" install 'conan==2.33.0' 'cmake==4.4.4'
          echo "$RUNNER_TEMP/conan-venv/bin" >> "$GITHUB_PATH"
      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.conan2/p
          key: conan-cxx26-gcc16-clang23-Debug-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/*', 'conan/recipes/**') }}
          restore-keys: |
            conan-cxx26-gcc16-clang23-Debug-
      - name: Determine analysis scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/static-analysis-changed"
      # Include checks need direct includes, not PCH or unity sources.
      - name: Resolve Conan dependencies for analysis
        run: |
          conan export conan/recipes/libalsa
          CC=clang-23 CXX=clang++-23 conan install . \
            -pr:h conan/profiles/linux-clang23 -pr:b conan/profiles/linux-gcc16 \
            -s:h build_type=Debug -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            --build=missing \
            -of build/linux-tidy/conan
      - name: Configure analysis database
        run: |
          source build/linux-tidy/conan/conanbuild.sh
          cmake --preset linux -B build/linux-tidy \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/linux-tidy/conan/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 \
            -DWIZ8_PRECOMPILE_HEADERS=OFF -DWIZ8_SURRENDER_UNITY_BUILD=OFF
          cmake --build build/linux-tidy --target surrender_shader_headers
      - name: Verify offline Metal and Direct3D shaders
        if: needs.scope.outputs.shaders == 'true'
        run: |
          source build/linux-tidy/conan/conanbuild.sh
          cmake -S tools/shadercross -B build/shadercross -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/linux-tidy/conan/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build build/shadercross --target shadercross --parallel 2
          python3 tools/shadercross/generate.py --check \
            --shadercross build/shadercross/_deps/shadercross-build/shadercross
      - name: Restore successful static analyses
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.CLANG_TIDY_CACHE_DIR }}
          key: tidy-cxx26-clang23-cmake444-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tidy-cxx26-clang23-cmake444-
      - name: Run clang-tidy
        env:
          CLANG_TIDY: clang-tidy-23
          RUN_CLANG_TIDY: run-clang-tidy-23
        run: |
          export CLANG_TIDY_JOBS="$(nproc)"
          clang-tidy-23 --verify-config --config-file=.clang-tidy-audit
          python3 -m py_compile tools/run-diagnostic-audit.py tools/run-clang-tidy-cached.py tools/clang_tidy_support.py
          python3 -m unittest discover -s tests/tools -p "*_test.py"
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            ./tools/run-clang-tidy.sh build/linux-tidy --changed-files "$RUNNER_TEMP/static-analysis-changed"
          else
            ./tools/run-clang-tidy.sh build/linux-tidy
          fi

      - name: Audit optional access and moved-from ownership
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CLANG_TIDY: clang-tidy-23
          RUN_CLANG_TIDY: run-clang-tidy-23
          CLANG_TIDY_CONFIG: ${{ github.workspace }}/.clang-tidy-audit
          CLANG_TIDY_JOBS: "2"
        run: ./tools/run-clang-tidy.sh build/linux-tidy
      - name: Audit strict lifetime, enums and parser buffers
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python3 tools/run-diagnostic-audit.py build/linux-tidy --output build/diagnostic-audit.log
      - name: Upload experimental compiler diagnostics
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostic-audit
          path: build/diagnostic-audit.log

      - name: Save successful static analyses
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.CLANG_TIDY_CACHE_DIR }}
          key: tidy-cxx26-clang23-cmake444-${{ github.run_id }}-${{ github.run_attempt }}
