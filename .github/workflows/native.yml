name: Native

on:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            ccache \
            cmake \
            curl \
            pkg-config \
            glslang-tools \
            zlib1g-dev \
            libsdl3-dev \
            libsdl3-image-dev \
            libavcodec-dev \
            libavformat-dev \
            libswresample-dev \
            libswscale-dev
          curl -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/libs/libsdl3-mixer/libsdl3-mixer0_3.2.4+ds-1_amd64.deb
          curl -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/libs/libsdl3-mixer/libsdl3-mixer-dev_3.2.4+ds-1_amd64.deb
          sudo apt-get install -y \
            ./libsdl3-mixer0_3.2.4+ds-1_amd64.deb \
            ./libsdl3-mixer-dev_3.2.4+ds-1_amd64.deb
      - name: Create cache directories
        run: mkdir -p "$CCACHE_DIR"
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: ccache-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.run_id }}
          restore-keys: |
            linux-ccache-
      - name: Configure
        run: cmake --preset linux -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build native game and fixtures
        run: cmake --build --preset linux --parallel "$(nproc)"
      - name: Test native contracts
        run: ctest --preset linux --output-on-failure
      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats || true
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.run_id }}
