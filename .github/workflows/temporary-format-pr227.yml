name: Temporary clang-format PR 227

on:
  push:
    branches:
      - claude/npc-dialogue-state

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/npc-dialogue-state
          fetch-depth: 0
      - name: Install clang-format 21
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-21
      - name: Apply formatter and remove temporary workflow
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/main HEAD)"
          git diff --name-only --diff-filter=ACM -z "$BASE" HEAD -- include src tests |
            grep -zE '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inc)$' |
            xargs -0 -r clang-format-21 -i
          git rm -- .github/workflows/temporary-format-pr227.yml
          git add -u -- include src tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply clang-format 21 to PR 227"
          git push origin HEAD:claude/npc-dialogue-state
