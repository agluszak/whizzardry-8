name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install clang-format 23
        run: tools/install-llvm.sh 23 clang-format
      - name: Check C and C++ files
        run: |
          git ls-files -z -- include src tests tools \
            | grep -zE '\.(c|cc|cxx|cpp|h|hpp)$' \
            | xargs -0 clang-format-23 --dry-run --Werror
