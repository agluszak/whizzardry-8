name: Format

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", LICENSE, .gitignore]
  pull_request:
    paths-ignore: ["**.md", "docs/**", LICENSE, .gitignore]

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pull pinned toolchain
        timeout-minutes: 5
        run: docker pull "$(<toolchain-image.txt)"
      - name: Check C and C++ files
        run: |
          git ls-files -z -- include src tests tools \
            | grep -zE '\.(c|cc|cxx|cpp|h|hpp)$' \
            | xargs -0 ./build.sh -- clang-format-23 --dry-run --Werror
