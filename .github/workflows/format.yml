name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install clang-format 21
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-21
      - name: Check complete changed C and C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" HEAD)"
          git diff --name-only --diff-filter=ACM -z "$MERGE_BASE" HEAD -- include src tests \
            | grep -zE '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inc)$' \
            | xargs -0 -r -n 32 clang-format-21 --dry-run --Werror
