name: Compilation benchmarks

on:
  push:
    branches: [build/compilation-performance]
  workflow_dispatch:

jobs:
  bench:
    name: "${{ matrix.variant }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: unity
            pch: "OFF"
            unity: "ON"
          - variant: pch-unity
            pch: "ON"
            unity: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake pkg-config glslang-tools \
            zlib1g-dev libjpeg-dev libsdl3-dev libsdl3-image-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libswscale-dev
          curl -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/libs/libsdl3-mixer/libsdl3-mixer0_3.2.4+ds-1_amd64.deb
          curl -fsSLO https://archive.ubuntu.com/ubuntu/pool/universe/libs/libsdl3-mixer/libsdl3-mixer-dev_3.2.4+ds-1_amd64.deb
          sudo apt-get install -y ./libsdl3-mixer0_3.2.4+ds-1_amd64.deb ./libsdl3-mixer-dev_3.2.4+ds-1_amd64.deb
      - name: Configure clean identical Debug builds
        shell: bash
        run: |
          cmake --preset linux-dev \
            -DWIZ8_PRECOMPILE_HEADERS=${{ matrix.pch }} \
            -DWIZ8_UNITY_BUILD=${{ matrix.unity }} \
            -DWIZ8_UNITY_BATCH_SIZE=4
      - name: Build and measure without compiler cache
        shell: bash
        run: |
          set +e
          /usr/bin/time -f 'elapsed_s=%e user_s=%U sys_s=%S peak_rss_kib=%M' \
            -o build-timing.txt \
            cmake --build --preset linux-dev --target Wiz8Native --parallel 4 > build-output.txt 2>&1
          result=$?
          echo "BENCH_RESULT variant=${{ matrix.variant }} exit=$result $(cat build-timing.txt)"
          printf '\n### ${{ matrix.variant }}\n\n' >> "$GITHUB_STEP_SUMMARY"
          echo "Exit: $result; $(cat build-timing.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "--- Last 70 build lines ---"
          tail -n 70 build-output.txt
          exit "$result"
